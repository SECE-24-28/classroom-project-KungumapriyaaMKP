   .slideshow {
    width: 1000%;
    height: 500px;
    margin: 20px auto;
    position: relative;
    overflow: hidden;
    object-fit : cover;
}

.slide {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
}

.slide.show {
    display: block;
}
    footer {
        background: #e8d8f1;
        text-align: center;
        padding: 12px;
        margin-top: 30px;
        font-size: 14px;
    }

    footer a {
        text-decoration: none;
        color: rgb(70, 30, 60);

    }

    footer a:hover {
        color: #E80071;
    }
    .search-box {
    text-align: center;
    margin: 15px 0;
}
</style>

<script>
let i = 0;
let slides = document.querySelectorAll(".slide");

function changeSlide() {
    slides.forEach(s => s.classList.remove("show"));
    slides[i].classList.add("show");
    i = (i + 1) % slides.length;
}

changeSlide(); // show first slide
setInterval(changeSlide, 2000);
</script>
